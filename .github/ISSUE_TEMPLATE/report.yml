name: Benchmark report
description: Submit an anonymous omot bench result. Run omot report to fill this in.
title: Benchmark report
labels: ["report"]
body:
  - type: markdown
    attributes:
      value: |
        This issue was filled in by `omot report`. Paste the JSON exactly as it was printed and do not edit it.

        Only the JSON fields are stored in `reports.ndjson` on the `dataset` branch — never your username, this issue's number, title, or text. See [PRIVACY.md](https://github.com/wemilabs/oh-my-otter/blob/main/PRIVACY.md) for exactly what is collected. Results update hourly at <https://ohmyotter.vercel.app/results>.
  - type: textarea
    id: payload
    attributes:
      label: Report payload
      render: json
    validations:
      required: true
