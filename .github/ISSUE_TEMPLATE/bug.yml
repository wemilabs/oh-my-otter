name: Bug report
description: Something in the omot CLI, a check, a benchmark task, or the site doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report security vulnerabilities privately instead; see [SECURITY.md](https://github.com/wemilabs/oh-my-otter/blob/main/SECURITY.md).
  - type: input
    id: omot-version
    attributes:
      label: omot version
      description: Output of `omot --version`.
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v22.13.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15, Ubuntu 24.04, Windows 11"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      placeholder: "omot scan --run"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error message or the wrong result.
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: "`--json` output"
      description: If the command supports `--json`, paste its output. Remove anything you don't want to share.
      render: json
